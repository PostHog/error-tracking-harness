name: Image

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              id: publish
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ghcr.io/posthog/error-tracking-harness:${{ github.sha }}
                      ghcr.io/posthog/error-tracking-harness:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            # Consumers pin this digest, never a tag: a digest cannot change under their CI.
            - name: Record the digest consumers pin
              env:
                  DIGEST: ${{ steps.publish.outputs.digest }}
              run: |
                  {
                    echo "## Image"
                    echo
                    echo 'Pin in consumer workflows (comment with the harness commit):'
                    echo
                    echo '```yaml'
                    echo "HARNESS_IMAGE: ghcr.io/posthog/error-tracking-harness@$DIGEST # ${GITHUB_SHA::12}"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
