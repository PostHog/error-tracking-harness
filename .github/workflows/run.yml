name: Matrix

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    image:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  platforms: linux/amd64
                  outputs: type=docker,dest=/tmp/image.tar
                  tags: error-tracking-harness:pr
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Check harness tests and fixture coverage
              run: |
                  docker load --input /tmp/image.tar
                  docker run --rm --entrypoint sh error-tracking-harness:pr \
                    -c 'node --test harness/tests/*.test.mjs && node harness/check-fixtures.mjs'
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: image
                  path: /tmp/image.tar
                  retention-days: 1

    run:
        needs: image
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                fixture: [webpack-5.112, rollup-4, vite-8, vite-8-isolated, cli-rollup-4, next-14, next-15, next-16-webpack, next-16-turbopack, nuxt-4, vite-8-sri, webpack-5.112-sri]
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: image
                  path: /tmp
            - run: docker load --input /tmp/image.tar
            - name: Run the matrix for ${{ matrix.fixture }}
              run: |
                  mkdir -p test-results
                  docker run --rm --network none \
                    -v "$PWD/test-results:/artifacts" \
                    error-tracking-harness:pr \
                    --artifacts /artifacts --fixtures ${{ matrix.fixture }} --plugins latest
            - name: Report
              if: always()
              run: cat test-results/report.md >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: failure()
              with:
                  name: results-${{ matrix.fixture }}
                  path: test-results
