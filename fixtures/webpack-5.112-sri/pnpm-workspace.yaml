minimumReleaseAge: 10080
# Test newly published PostHog integrations without waiting for the third-party cooldown.
minimumReleaseAgeExclude:
    - "@posthog/*"
    - posthog-js
    - posthog-node
nodeLinker: hoisted
# The CLI package downloads its binary in postinstall; core-js only prints a banner.
allowBuilds:
    "@posthog/cli": true
    core-js: false
