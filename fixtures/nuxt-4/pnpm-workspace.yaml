minimumReleaseAge: 10080
# Test newly published PostHog integrations without waiting for the third-party cooldown.
minimumReleaseAgeExclude:
    - "@posthog/*"
    - posthog-js
    - posthog-node
nodeLinker: hoisted
# The CLI package downloads its binary in postinstall; the plugins resolve it from node_modules/.bin.
allowBuilds:
    "@posthog/cli": true
    core-js: false
    esbuild: false
    "@parcel/watcher": false
    unrs-resolver: false
strictDepBuilds: false
